<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCAW - Bienvenido</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>

    <!-- Fondos animados de cristal -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <main class="splash-container">
        <div class="glass-card">
            <div class="logo-container">
                <span class="icon">🛒</span>
                <h1>LCAW</h1>
                <p class="subtitle">Los Chavales - Punto de Venta</p>
            </div>

            <div class="loader-box">
                <p class="status-text">Cargando sistema...</p>
                <div class="progress-bar-container">
                    <div class="progress-bar"></div>
                </div>
                <span class="counter-text">Redirigiendo en <strong id="contador">5</strong> segundos</span>
            </div>

            <a href="pages/login.html" class="btn-saltar">Ingresar ahora ➔</a>
        </div>
    </main>

    <script>
        let segundos = 5;
        const elemContador = document.getElementById('contador');

        const intervalo = setInterval(() => {
            segundos--;
            if (elemContador) elemContador.textContent = segundos;

            if (segundos <= 0) {
                clearInterval(intervalo);
                window.location.href = 'pages/login.html';
            }
        }, 1000);
    </script>
</body>
</html>
