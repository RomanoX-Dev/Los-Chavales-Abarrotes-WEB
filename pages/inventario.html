<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCAW - Módulo de Inventario</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <!-- Carga de estilos -->
    <link rel="stylesheet" href="../general/global.css">
    <link rel="stylesheet" href="../styles/menu.css">
    <link rel="stylesheet" href="../styles/inventario.css">
    <link rel="stylesheet" href="../componentstyles/inventarioCOM.css">
    <link rel="stylesheet" href="../cards/Tarjetainventario.css">
    <link rel="stylesheet" href="../cards/Tarjetaeliminacion.css">
    <link rel="stylesheet" href="../styles/alertas.css">
</head>
<body>

    <div class="dashboard-container">

        <!-- 1. BARRA LATERAL (MADRE) -->
        <app-sidebar></app-sidebar>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            
            <!-- 2. BARRA SUPERIOR (MADRE) -->
            <app-header 
                titulo="Módulo de Inventario 📦" 
                subtitulo="Gestión de productos, catálogo y existencias">
            </app-header>

            <!-- BARRA DE HERRAMIENTAS DE BÚSQUEDA Y ACCIONES -->
            <section class="toolbar glass-panel">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="buscadorProductos" placeholder="Buscar por código o nombre...">
                </div>
                <button class="btn-primario" id="btnAgregarProducto" type="button">+ Agregar Producto</button>
            </section>

            <!-- TABLA DE INVENTARIO -->
            <section class="table-container glass-panel">
                <table class="glass-table">
                    <thead>
                        <tr>
                            <th>Imagen</th> 
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>P. Venta</th>
                            <th>Stock</th>
                            <th>Estatus</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaProductos">
                        <tr>
                            <td colspan="8" class="texto-cargando-tabla">Cargando inventario... ⏳</td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <!-- Contenedor dinámico para Modales -->
    <div id="contenedorModalProducto"></div>

    <!-- Scripts de la aplicación -->
    <script type="module" src="../scripts/menu.js"></script>
    <script type="module" src="../scripts/inventario.js"></script>
</body>
</html>
