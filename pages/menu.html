<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCAW - Panel Principal</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!-- Estilos globales y específicos -->
    <link rel="stylesheet" href="../general/global.css">
    <link rel="stylesheet" href="../styles/menu.css">
    <link rel="stylesheet" href="../componentstyles/menuCOM.css">
</head>
<body>

    <div class="dashboard-container">
        
        <!-- 1. BARRA LATERAL REUTILIZABLE -->
        <app-sidebar></app-sidebar>

        <!-- ÁREA PRINCIPAL -->
        <main class="main-content">
            
            <!-- 2. BARRA SUPERIOR REUTILIZABLE (con el botón ⚡ Nueva Venta activado por atributo 'mostrar-pos') -->
            <app-header 
                titulo="Panel Principal 🏠" 
                subtitulo="Resumen operativo y anuncios del día"
                mostrar-pos>
            </app-header>

            <!-- MÉTRICAS OPERATIVAS (KPIs) -->
            <section class="kpi-grid">
                <article class="kpi-card glass-panel">
                    <div class="kpi-icono">💰</div>
                    <div class="kpi-info">
                        <span class="kpi-titulo">Ventas del Día</span>
                        <h3 id="kpiVentas" class="kpi-monto">$0.00</h3>
                    </div>
                </article>

                <article class="kpi-card glass-panel warning">
                    <div class="kpi-icono">⚠️</div>
                    <div class="kpi-info">
                        <span class="kpi-titulo">Stock Bajo</span>
                        <h3 id="kpiStockBajo" class="kpi-monto">0 productos</h3>
                    </div>
                </article>

                <article class="kpi-card glass-panel success">
                    <div class="kpi-icono">🔓</div>
                    <div class="kpi-info">
                        <span class="kpi-titulo">Corte de Caja</span>
                        <h3 id="kpiCorteEstado" class="kpi-monto">Abierto</h3>
                    </div>
                </article>
            </section>

            <!-- CATÁLOGO Y ANUNCIOS (Se llena desde menuCOM.js) -->
            <section class="catalogo-seccion">
                <div class="seccion-header">
                    <h2>📢 Anuncios & Productos Destacados</h2>
                    <span class="badge-estado">Vista previa</span>
                </div>

                <div id="contenedorCatalogo" class="catalogo-grid">
                    <p class="mensaje-cargando">Cargando catálogo...</p>
                </div>
            </section>

        </main>
    </div>

    <!-- Script principal -->
    <script type="module" src="../scripts/menu.js"></script>
</body>
</html>
