<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCAW - Punto de Venta</title>
    <link rel="stylesheet" href="../styles/menu.css">
    <link rel="stylesheet" href="../styles/pos.css">
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="dashboard-container">
        
        <aside class="sidebar glass-panel">
            <div class="logo">
                <h2>🛒 LCAW</h2>
                <span>Los Chavales</span>
            </div>
            <nav class="sidebar-menu">
                <button class="menu-btn" onclick="navegarA('menu.html')">🏠 Inicio</button>
                <button class="menu-btn active" onclick="navegarA('pos.html')">💻 Punto de Venta</button>
                <button class="menu-btn" onclick="navegarA('productos.html')">📦 Inventario</button>
                <button class="menu-btn" onclick="navegarA('clientes.html')">👥 Clientes</button>
                <button class="menu-btn" onclick="navegarA('ventas.html')">📊 Historial</button>
                <button class="menu-btn" onclick="navegarA('usuarios.html')">⚙️ Usuarios</button>
            </nav>
            <div class="sidebar-footer">
                <button id="btnCerrarSesion" class="btn-logout">🚪 Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content pos-layout">
            
            <section class="panel-carrito glass-panel">
                <div class="carrito-header">
                    <h2>Ticket de Venta 🧾</h2>
                    <button class="btn-icon" id="btnVaciarCarrito" title="Vaciar Ticket">🗑️</button>
                </div>
                
                <div class="carrito-items" id="listaCarrito">
                    <div class="mensaje-vacio">El carrito está vacío. Agrega productos para comenzar.</div>
                </div>

                <div class="carrito-footer">
                    <div class="totales">
                        <div class="fila-total">
                            <span>Subtotal:</span>
                            <span id="txtSubtotal">$0.00</span>
                        </div>
                        <div class="fila-total">
                            <span>IVA (16%):</span>
                            <span id="txtIva">$0.00</span>
                        </div>
                        <div class="fila-total gran-total">
                            <span>TOTAL:</span>
                            <span id="txtTotal">$0.00</span>
                        </div>
                    </div>
                    <button class="btn-cobrar" id="btnCobrar">💰 COBRAR</button>
                </div>
            </section>

            <section class="panel-productos">
                <header class="topbar glass-panel pos-topbar">
                    <div class="search-box pos-search">
                        <span>🔍</span>
                        <input type="text" id="buscadorPos" placeholder="Escanear código de barras o buscar producto...">
                    </div>
                </header>

                <div class="grid-productos" id="contenedorProductosPos">
                    <h3 style="color: white; text-align: center; width: 100%; margin-top: 50px;">Cargando productos... ⏳</h3>
                </div>
            </section>

        </main>
    </div>

    <script src="../scripts/menu.js"></script>
    <script src="../scripts/pos.js"></script>
</body>
</html>
